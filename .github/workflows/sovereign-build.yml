name: Sovereign Build

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional explicit Sovereign release version override
        required: false
        type: string
      verify_marketplace:
        description: Verify the configured Marketplace proxy is reachable from the runner
        required: false
        default: false
        type: boolean
      publish_release:
        description: Publish a GitHub Release after both Linux archives pass
        required: false
        default: false
        type: boolean
      mark_prerelease:
        description: Mark the published GitHub Release as a pre-release
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: sovereign-build-linux
  cancel-in-progress: false

jobs:
  linux-archive:
    if: github.repository != 'microsoft/vscode'
    name: linux-${{ matrix.vscode_arch }}-archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode_arch: x64
            npm_arch: x64
            runner: ubuntu-24.04
          - vscode_arch: arm64
            npm_arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
      NPM_ARCH: ${{ matrix.npm_arch }}
      VSCODE_QUALITY: stable
      VSCODE_BUILD_SKIP_EXTENSIONS_GALLERY: '1'
    steps:
      - name: Checkout Sovereign recipe revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup build dependencies
        run: |
          set -euo pipefail

          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y \
            pkg-config \
            xvfb \
            libgtk-3-0 \
            libxkbfile-dev \
            libkrb5-dev \
            libgbm1 \
            fakeroot \
            rpm \
            bubblewrap \
            socat
          sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
          sudo chmod +x /etc/init.d/xvfb
          sudo update-rc.d xvfb defaults
          sudo service xvfb start

      - name: Fetch release inputs
        id: inputs
        run: |
          set -euo pipefail

          upstream_base="$(awk 'NF && $1 !~ /^#/ { print $1; exit }' sovereign/upstream-base)"
          if [[ -z "$upstream_base" ]]; then
            echo 'sovereign/upstream-base is empty' >&2
            exit 1
          fi

          upstream_url='https://github.com/microsoft/vscode.git'
          git fetch --depth=1 "$upstream_url" "refs/tags/$upstream_base:refs/tags/$upstream_base"
          git fetch --depth=100 --prune origin \
            '+refs/heads/topic/*:refs/heads/topic/*' \
            '+refs/heads/topic-base/*:refs/heads/topic-base/*'

          echo "upstream_base=$upstream_base" >> "$GITHUB_OUTPUT"

      - name: Configure Git committer
        run: |
          git config user.name 'Sovereign CI'
          git config user.email 'sovereign-ci@users.noreply.github.com'

      - name: Compose patch stack
        id: compose
        run: |
          set -euo pipefail

          sovereign/scripts/compose.sh --base '${{ steps.inputs.outputs.upstream_base }}'

          composed_commit="$(git -C .git/sovereign-compose rev-parse HEAD)"
          echo "commit=$composed_commit" >> "$GITHUB_OUTPUT"
          echo "BUILD_SOURCEVERSION=$composed_commit" >> "$GITHUB_ENV"

      - name: Import official product metadata
        run: |
          set -euo pipefail

          sovereign/scripts/import-official-product-metadata.sh \
            --repo .git/sovereign-compose \
            --upstream-base '${{ steps.inputs.outputs.upstream_base }}' \
            --platform 'linux-${{ matrix.vscode_arch }}' \
            --quality stable

      - name: Compute release version
        id: version
        run: |
          set -euo pipefail

          mkdir -p .build/sovereign-release
          args=(
            --upstream-base '${{ steps.inputs.outputs.upstream_base }}'
            --remote origin
            --github-output "$GITHUB_OUTPUT"
            --json .build/sovereign-release/release-version.json
          )
          override='${{ inputs.release_version }}'
          if [[ -n "$override" ]]; then
            args+=(--override "$override")
          fi

          node sovereign/scripts/compute-release-version.mjs "${args[@]}"

      - name: Install dependencies
        working-directory: .git/sovereign-compose
        run: |
          set -euo pipefail

          npm ci
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply build-time release version
        run: |
          node sovereign/scripts/apply-release-version.mjs \
            --repo .git/sovereign-compose \
            --version '${{ steps.version.outputs.release_version }}'

      - name: Build Linux ${{ matrix.vscode_arch }} archive tree
        working-directory: .git/sovereign-compose
        run: |
          set -euo pipefail

          npm run electron '${{ matrix.vscode_arch }}'
          npm run gulp 'vscode-linux-${{ matrix.vscode_arch }}-min'
        env:
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          npm_config_arch: ${{ env.NPM_ARCH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test Linux ${{ matrix.vscode_arch }} build
        working-directory: .git/sovereign-compose
        timeout-minutes: 20
        run: |
          set -euo pipefail

          build_dir="$GITHUB_WORKSPACE/.git/VSCode-linux-${{ matrix.vscode_arch }}"
          if [[ ! -d "$build_dir" ]]; then
            echo "Expected build output directory missing: $build_dir" >&2
            exit 1
          fi

          npm run smoketest -- \
            --build "$build_dir" \
            --stable-build "$build_dir" \
            --tracing \
            --electronArgs '--no-sandbox --disable-gpu' \
            -g Launch
        env:
          DISPLAY: ':10'

      - name: Verify Marketplace access
        if: ${{ inputs.verify_marketplace }}
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const buildDir = path.join(process.env.GITHUB_WORKSPACE, '.git', 'VSCode-linux-${{ matrix.vscode_arch }}');
            const product = JSON.parse(fs.readFileSync(path.join(buildDir, 'resources', 'app', 'product.json'), 'utf8'));
            const gallery = product.extensionsGallery;
            if (!gallery?.serviceUrl) {
              throw new Error('Packaged product is missing extensionsGallery.serviceUrl');
            }

            const body = JSON.stringify({
              filters: [{
                criteria: [
                  { filterType: 7, value: 'ms-python.python' },
                  { filterType: 8, value: 'Microsoft.VisualStudio.Code' },
                ],
                pageNumber: 1,
                pageSize: 1,
                sortBy: 0,
                sortOrder: 0,
              }],
              assetTypes: [],
              flags: 0x20 | 0x80 | 0x200,
            });

            const response = await fetch(`${gallery.serviceUrl}/extensionquery`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json;api-version=3.0-preview.1',
                'Content-Length': String(Buffer.byteLength(body)),
              },
              body,
            });

            if (!response.ok) {
              throw new Error(`Marketplace query failed: HTTP ${response.status}`);
            }

            const result = await response.json();
            const extension = result?.results?.[0]?.extensions?.[0];
            const extensionId = extension && `${extension.publisher.publisherName}.${extension.extensionName}`;
            if (extensionId !== 'ms-python.python') {
              throw new Error(`Marketplace query returned unexpected extension: ${extensionId ?? '<none>'}`);
            }

            console.log(`Marketplace query succeeded: ${extensionId}`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Package artifact and provenance
        id: artifact
        run: |
          set -euo pipefail

          release_dir="$GITHUB_WORKSPACE/.build/sovereign-release"
          mkdir -p "$release_dir"

          build_dir="$GITHUB_WORKSPACE/.git/VSCode-linux-${{ matrix.vscode_arch }}"
          artifact_name="code-oss-linux-${{ matrix.vscode_arch }}-${{ steps.version.outputs.release_version }}.tar.gz"
          artifact_path="$release_dir/$artifact_name"

          if [[ ! -d "$build_dir" ]]; then
            echo "Expected build output directory missing: $build_dir" >&2
            exit 1
          fi

          tar -C "$(dirname "$build_dir")" -czf "$artifact_path" "$(basename "$build_dir")"
          sha256="$(sha256sum "$artifact_path" | awk '{ print $1 }')"
          printf '%s  %s\n' "$sha256" "$artifact_name" > "$artifact_path.sha256"

          node sovereign/scripts/write-release-provenance.mjs \
            --repo .git/sovereign-compose \
            --release-version '${{ steps.version.outputs.release_version }}' \
            --upstream-base '${{ steps.inputs.outputs.upstream_base }}' \
            --artifact "$artifact_path" \
            --sha256 "$sha256" \
            --output "$release_dir/sovereign-provenance.json"

          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: sovereign-linux-${{ matrix.vscode_arch }}-${{ steps.version.outputs.release_version }}
          path: .build/sovereign-release/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: ${{ inputs.publish_release && github.repository != 'microsoft/vscode' }}
    name: publish-release
    needs: linux-archive
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      release_tag: ${{ steps.assets.outputs.release_tag }}
    steps:
      - name: Checkout Sovereign recipe revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Compute release version
        id: version
        run: |
          set -euo pipefail

          upstream_base="$(awk 'NF && $1 !~ /^#/ { print $1; exit }' sovereign/upstream-base)"
          if [[ -z "$upstream_base" ]]; then
            echo 'sovereign/upstream-base is empty' >&2
            exit 1
          fi

          mkdir -p .build/sovereign-release
          args=(
            --upstream-base "$upstream_base"
            --remote origin
            --github-output "$GITHUB_OUTPUT"
            --json .build/sovereign-release/release-version.json
          )
          override='${{ inputs.release_version }}'
          if [[ -n "$override" ]]; then
            args+=(--override "$override")
          fi

          node sovereign/scripts/compute-release-version.mjs "${args[@]}"

      - name: Download Linux x64 release artifact
        uses: actions/download-artifact@v7
        with:
          name: sovereign-linux-x64-${{ steps.version.outputs.release_version }}
          path: .build/sovereign-release-downloads/x64

      - name: Download Linux arm64 release artifact
        uses: actions/download-artifact@v7
        with:
          name: sovereign-linux-arm64-${{ steps.version.outputs.release_version }}
          path: .build/sovereign-release-downloads/arm64

      - name: Prepare release assets
        id: assets
        run: |
          set -euo pipefail

          release_version='${{ steps.version.outputs.release_version }}'
          release_tag='${{ steps.version.outputs.release_tag }}'
          input_root="$GITHUB_WORKSPACE/.build/sovereign-release-downloads"
          asset_dir="$GITHUB_WORKSPACE/.build/sovereign-release-assets"
          notes="$GITHUB_WORKSPACE/.build/sovereign-release-notes.md"
          mkdir -p "$asset_dir"
          artifact_lines=()

          cmp "$input_root/x64/release-version.json" "$input_root/arm64/release-version.json"
          cp "$input_root/x64/release-version.json" "$asset_dir/release-version.json"

          for arch in x64 arm64; do
            dir="$input_root/$arch"
            artifact_name="code-oss-linux-$arch-$release_version.tar.gz"
            artifact_path="$dir/$artifact_name"
            sha_path="$artifact_path.sha256"
            provenance_path="$dir/sovereign-provenance.json"

            if [[ ! -f "$artifact_path" ]]; then
              echo "Missing release artifact: $artifact_path" >&2
              exit 1
            fi
            if [[ ! -f "$sha_path" ]]; then
              echo "Missing SHA256 sidecar: $sha_path" >&2
              exit 1
            fi
            if [[ ! -f "$provenance_path" ]]; then
              echo "Missing provenance sidecar: $provenance_path" >&2
              exit 1
            fi

            (
              cd "$dir"
              sha256sum -c "$artifact_name.sha256"
            )

            read -r artifact_sha artifact_file < "$sha_path"
            if [[ "$artifact_file" != "$artifact_name" ]]; then
              echo "SHA256 sidecar for $arch names '$artifact_file', expected '$artifact_name'" >&2
              exit 1
            fi

            root_count="$(tar -tzf "$artifact_path" | awk -F/ 'NF && !seen[$1]++ { count++ } END { print count + 0 }')"
            if [[ "$root_count" != '1' ]]; then
              echo "Expected $artifact_name to contain exactly one root directory, found $root_count" >&2
              exit 1
            fi

            node - "$provenance_path" "$artifact_name" "$artifact_sha" "$release_version" <<'NODE'
          const fs = require('fs');
          const [provenancePath, artifactName, artifactSha, releaseVersion] = process.argv.slice(2);
          const provenance = JSON.parse(fs.readFileSync(provenancePath, 'utf8'));
          if (provenance.releaseVersion !== releaseVersion) {
            throw new Error(`Provenance ${provenancePath} has releaseVersion ${provenance.releaseVersion}, expected ${releaseVersion}`);
          }
          if (provenance.releaseTag !== releaseVersion) {
            throw new Error(`Provenance ${provenancePath} has releaseTag ${provenance.releaseTag}, expected ${releaseVersion}`);
          }
          if (provenance.artifact?.name !== artifactName) {
            throw new Error(`Provenance ${provenancePath} has artifact name ${provenance.artifact?.name}, expected ${artifactName}`);
          }
          if (provenance.artifact?.sha256 !== artifactSha) {
            throw new Error(`Provenance ${provenancePath} has artifact sha256 ${provenance.artifact?.sha256}, expected ${artifactSha}`);
          }
          NODE

            cp "$artifact_path" "$asset_dir/$artifact_name"
            cp "$sha_path" "$asset_dir/$artifact_name.sha256"
            cp "$provenance_path" "$asset_dir/sovereign-linux-$arch-$release_version.provenance.json"
            artifact_lines+=("- \`$artifact_name\` — SHA256 \`$artifact_sha\`")
          done

          {
            echo "# Sovereign Code $release_version"
            echo
            echo "Experimental Linux archive release built from Sovereign recipe commit \`$GITHUB_SHA\`."
            echo
            echo "This release currently uses Ubuntu 24.04 GitHub-hosted runners as its runtime baseline. Broader Linux distribution compatibility is not yet guaranteed."
            echo
            echo "## Artifacts"
            printf '%s\n' "${artifact_lines[@]}"
            echo
            echo "## Provenance"
            echo
            echo "Each architecture has a \`sovereign-linux-<arch>-$release_version.provenance.json\` sidecar. \`release-version.json\` records the release lane computation."
          } > "$notes"

          {
            echo "asset_dir=$asset_dir"
            echo "notes=$notes"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        run: |
          set -euo pipefail

          release_version='${{ steps.version.outputs.release_version }}'
          release_tag='${{ steps.assets.outputs.release_tag }}'
          asset_dir='${{ steps.assets.outputs.asset_dir }}'
          notes='${{ steps.assets.outputs.notes }}'

          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Release tag already exists: $release_tag" >&2
            exit 1
          fi

          args=(
            release create "$release_tag"
            "$asset_dir"/*
            --target "$GITHUB_SHA"
            --title "Sovereign Code $release_version"
            --notes-file "$notes"
          )
          if [[ '${{ inputs.mark_prerelease }}' == 'true' ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

  publish-update-manifest:
    if: ${{ inputs.publish_release && github.repository != 'microsoft/vscode' }}
    name: publish-update-manifest
    needs: publish-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Sovereign recipe revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Publish update manifest
        run: |
          set -euo pipefail

          release_version='${{ needs.publish-release.outputs.release_version }}'
          release_tag='${{ needs.publish-release.outputs.release_tag }}'
          manifest_worktree="$GITHUB_WORKSPACE/.build/sovereign-update-manifest"

          git config user.name 'Sovereign CI'
          git config user.email 'sovereign-ci@users.noreply.github.com'

          rm -rf "$manifest_worktree"
          if git ls-remote --exit-code --heads origin manifest >/dev/null 2>&1; then
            git fetch --depth=1 origin '+refs/heads/manifest:refs/remotes/origin/manifest'
            git worktree add -B manifest "$manifest_worktree" refs/remotes/origin/manifest
          else
            git worktree add --orphan -b manifest "$manifest_worktree"
          fi

          node sovereign/scripts/write-update-manifest.mjs \
            --github-repository "$GITHUB_REPOSITORY" \
            --release-tag "$release_tag" \
            --quality stable \
            --output "$manifest_worktree/manifest.json"

          git -C "$manifest_worktree" add manifest.json
          if git -C "$manifest_worktree" diff --cached --quiet -- manifest.json; then
            echo 'Update manifest unchanged'
            exit 0
          fi

          git -C "$manifest_worktree" diff --cached -- manifest.json
          git -C "$manifest_worktree" commit -m "Promote Sovereign Code $release_version to stable"
          git -C "$manifest_worktree" push origin HEAD:manifest
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate update endpoint
        run: |
          set -euo pipefail

          manifest_path="$GITHUB_WORKSPACE/.build/sovereign-update-manifest/manifest.json"
          node - "$manifest_path" <<'NODE'
          const fs = require('fs');

          const manifestPath = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const endpoint = 'https://updates.rueschegg.integral-it.ch/api/update';
          const staleCommit = '0000000000000000000000000000000000000000';
          const quality = 'stable';
          const platforms = ['linux-x64', 'linux-arm64'];

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function waitFor(label, fn) {
            let last;
            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                await fn(attempt);
                return;
              } catch (error) {
                last = error;
                console.log(`${label}: attempt ${attempt} failed: ${error.message}`);
                if (attempt < 12) {
                  await sleep(10_000);
                }
              }
            }
            throw last;
          }

          async function readBody(response) {
            const text = await response.text();
            if (!text) {
              return undefined;
            }
            try {
              return JSON.parse(text);
            } catch (error) {
              throw new Error(`response was not JSON: ${error.message}: ${text.slice(0, 200)}`);
            }
          }

          function assertEqual(label, actual, expected) {
            if (actual !== expected) {
              throw new Error(`${label}: got ${actual}, expected ${expected}`);
            }
          }

          async function main() {
            for (const platform of platforms) {
              const entry = manifest.channels?.[quality]?.[platform];
              if (!entry) {
                throw new Error(`Manifest is missing ${quality}/${platform}`);
              }

              await waitFor(`${platform} stale update`, async () => {
                const response = await fetch(`${endpoint}/${platform}/${quality}/${staleCommit}`);
                assertEqual(`${platform} stale status`, response.status, 200);
                const update = await readBody(response);
                assertEqual(`${platform} stale version`, update?.version, entry.version);
                assertEqual(`${platform} stale productVersion`, update?.productVersion, entry.productVersion);
                assertEqual(`${platform} stale sha256hash`, update?.sha256hash, entry.sha256hash);
              });

              await waitFor(`${platform} current update`, async () => {
                const response = await fetch(`${endpoint}/${platform}/${quality}/${entry.version}`);
                assertEqual(`${platform} current status`, response.status, 204);
              });

              console.log(`${platform}: update endpoint validated for ${entry.productVersion} (${entry.version})`);
            }
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

  report-build-result:
    if: ${{ always() && inputs.publish_release && github.repository != 'microsoft/vscode' }}
    name: report-build-result
    needs:
      - linux-archive
      - publish-release
      - publish-update-manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Sovereign recipe revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Report release build result
        run: |
          set -euo pipefail

          if [[ "$REPORT_BUILD_LINUX_ARCHIVE_RESULT" == 'success' && "$REPORT_BUILD_PUBLISH_RELEASE_RESULT" == 'success' && "$REPORT_BUILD_PUBLISH_UPDATE_MANIFEST_RESULT" == 'success' ]]; then
            sovereign/scripts/report-build.sh success
          else
            sovereign/scripts/report-build.sh failure
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_BUILD_REF: ${{ github.ref }}
          REPORT_BUILD_SHA: ${{ github.sha }}
          REPORT_BUILD_RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
          REPORT_BUILD_LINUX_ARCHIVE_RESULT: ${{ needs.linux-archive.result }}
          REPORT_BUILD_PUBLISH_RELEASE_RESULT: ${{ needs.publish-release.result }}
          REPORT_BUILD_PUBLISH_UPDATE_MANIFEST_RESULT: ${{ needs.publish-update-manifest.result }}
          REPORT_BUILD_VERIFY_MARKETPLACE: ${{ inputs.verify_marketplace }}
          REPORT_BUILD_MARK_PRERELEASE: ${{ inputs.mark_prerelease }}
