name: Sovereign Mirror Upstream Tags

on:
  push:
    branches:
      - sovereign/main
    paths:
      - .github/workflows/sovereign-mirror-upstream-tags.yml
      - sovereign/upstream-base
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sovereign-mirror-upstream-tags
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository != 'microsoft/vscode'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Sovereign recipe branch
        uses: actions/checkout@v7
        with:
          ref: sovereign/main
          fetch-depth: 1

      - name: Dispatch canary for new upstream tags
        run: |
          set -euo pipefail

          upstream_url='https://github.com/microsoft/vscode.git'
          current_base="$(awk 'NF && $1 !~ /^#/ { print $1; exit }' sovereign/upstream-base)"

          # Canary fetches upstream tags directly from microsoft/vscode. Do not
          # mirror those tag refs into this repository: GitHub rejects refs that
          # introduce Microsoft-owned Git LFS objects we intentionally do not
          # mirror. Instead, record seen upstream tags with no-LFS marker
          # branches that point at sovereign/main.

          version_ge() {
            local lhs="$1"
            local rhs="$2"
            [[ "$(printf '%s\n%s\n' "$lhs" "$rhs" | sort -V | tail -n1)" == "$lhs" ]]
          }

          version_gt() {
            [[ "$1" != "$2" ]] && version_ge "$1" "$2"
          }

          is_upstream_release_tag() {
            local tag="$1"
            [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || return 1
            local patch="${tag##*.}"
            (( patch < 10000 ))
          }

          mapfile -t upstream_tags < <(
            git ls-remote --tags --refs "$upstream_url" \
              | awk '{ sub("refs/tags/", "", $2); print $2 }' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V
          )

          dispatched=0
          for tag in "${upstream_tags[@]}"; do
            if ! is_upstream_release_tag "$tag"; then
              continue
            fi

            if ! version_gt "$tag" "$current_base"; then
              continue
            fi

            marker_ref="refs/heads/sovereign/upstream-seen/$tag"
            if git ls-remote --exit-code --heads origin "$marker_ref" >/dev/null 2>&1; then
              continue
            fi

            echo "Dispatching Sovereign canary for upstream tag $tag"
            gh workflow run sovereign-rebase-canary.yml --ref sovereign/main -f "target_tag=$tag"
            git push origin "HEAD:$marker_ref"
            dispatched=$((dispatched + 1))
          done

          echo "Dispatched canary for $dispatched new upstream tag(s)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
